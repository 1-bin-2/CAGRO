name: tests

on:
  push:
  pull_request:

jobs:
  paper-critical-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run dependency-free CAGRO tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q src tests
      - name: Check canonical launcher syntax
        run: bash -n run_scripts/run_grpo_qwenomni_stage2.sh
